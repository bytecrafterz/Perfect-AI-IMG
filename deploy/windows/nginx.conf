« ---------------------------------------------------------------------------
# nginx.conf  --  estudio (FastAPI/uvicorn) reverse proxy
# Platform: nginx for Windows (official nginx.org win build), Windows Server 2022/2025 x64
# Assumed nginx prefix: C:\nginx  ->  written as C:/nginx in this file
#
# PATHS: nginx.conf uses FORWARD SLASHES on Windows. A backslash is an escape
# character in the nginx config parser, so "C:\nginx\logs" is silently wrong.
# Always write C:/nginx/logs. Absolute paths only, so the config behaves the
# same whether nginx is started by a human or by the service manager.
#
# ---------------------------------------------------------------------------
# THINGS YOU MUST VERIFY ON FIRST RUN (do not assume, check):
#   1. The /static/ root below points at the directory the FastAPI app mounts
#      as StaticFiles. If it does not, either fix the root or delete the
#      /static/ block entirely and let the app serve it (correctness first).
#   2. The win-acme PEM output directory and file names (see the TLS section).
#   3. That C:/nginx/temp/client_body exists and is writable by the account the
#      nginx service runs as. Uploads fail with 500 if it is not.
#   4. That Windows Firewall allows inbound TCP 80 and 443.
#   5. That the account the nginx service runs as can READ the private key file.
#      win-acme tightens ACLs on its own output; if nginx cannot open the key it
#      does not start, and it will not start again after any renewal either.
#   Test the config before every restart -- this is not optional, a rejected
#   config means nginx exits instead of starting:
#      C:\nginx\nginx.exe -t -p C:/nginx/ -c C:/nginx/conf/nginx.conf
#
# ---------------------------------------------------------------------------
# SURVIVING REBOOT WITHOUT A HUMAN LOGGING IN
# nginx for Windows is a plain console application. It is NOT a Windows service
# and `sc create` pointed straight at nginx.exe does not work -- nginx does not
# implement the Service Control Manager handshake, so the SCM kills it after the
# start timeout. Wrap it with a service host such as NSSM or WinSW:
#     - Application:       C:\nginx\nginx.exe
#     - Startup directory: C:\nginx        (nginx resolves its prefix from here)
#     - Startup type:      Automatic
# Because of that wrapper, `daemon off;` is set below: the wrapper needs one
# process to stay in the foreground and watch. Do the same for uvicorn --
# it needs its own service entry, started before or alongside nginx, with the
# working directory set to C:\estudio so that C:\estudio\.env is found:
#     C:\estudio\.venv\Scripts\python.exe -m uvicorn app.main:app
#         --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips 127.0.0.1
# Confirm the exact service-manager flags in that tool's own docs; they are not
# reproduced here because getting them subtly wrong is worse than looking them up.
#
# After any change to this file, restart the service and then confirm the site
# actually answers. A config nginx refuses looks identical, from the outside, to
# a machine that is switched off.
# ---------------------------------------------------------------------------

# `user` is deliberately absent: nginx for Windows ignores it (it has no setuid)
# and logs a warning on every start. The service account is chosen in the
# service wrapper instead.

# nginx for Windows can start several workers, but only ONE of them actually
# accepts and serves connections -- the others idle. More than 1 buys nothing
# and makes shared state (SSL session cache, logs) harder to reason about.
worker_processes  1;

# Keep nginx in the foreground so NSSM/WinSW can supervise and restart it.
# Comment this out if you are running nginx by hand from a console for testing.
daemon            off;

# MAIN CONTEXT ONLY. This directive is not permitted inside http {} -- nginx
# refuses to load the entire file and exits if it is placed there, which under a
# service wrapper looks exactly like "the site is down and nobody knows why".
# On reload, workers with an open SSE stream would otherwise linger until the
# client disconnects -- which, for a stream designed never to end, can be
# forever, leaving stale workers behind after every config change.
worker_shutdown_timeout 30s;

error_log         C:/nginx/logs/error.log warn;
pid               C:/nginx/logs/nginx.pid;

events {
    # nginx/Windows uses select(); epoll/kqueue/IOCP are not available, so do
    # NOT add an `use ...;` directive here -- it will fail to load. select() on
    # Windows is bounded by FD_SETSIZE, which the official build compiles at
    # 1024, so raising this number does not raise the real ceiling.
    # For a single-user tool this is orders of magnitude more than needed.
    worker_connections  1024;
}

http {
    include       C:/nginx/conf/mime.types;
    default_type  application/octet-stream;

    # If the PWA manifest is served from /static/ and the browser ignores it,
    # the stock mime.types on this build has no mapping for .webmanifest. Add
    # one here (a `types { ... }` block merges with the included set) rather
    # than renaming the file:
    #     types { application/manifest+json  webmanifest; }

    # Do not advertise the exact nginx version in responses and error pages.
    server_tokens off;

    # ---------------------------------------------------------------------
    # LOGGING
    # These are private photographs. Every line of access.log that contains a
    # /media/ URL is a durable, plaintext index of her images sitting on disk
    # and inside any backup of this box. Logging is therefore ON for
    # app/HTML/API traffic (where it has diagnostic value) and OFF for /media/
    # and /static/ (where it is bulk noise plus a privacy liability).
    # $request_time and $upstream_response_time are included because they are
    # the only cheap way to see a stalled SSE stream or a slow batch.
    # ---------------------------------------------------------------------
    log_format estudio '$remote_addr $status $request_method $uri '
                       'body=$body_bytes_sent rt=$request_time urt=$upstream_response_time';
    #                                          ^ $uri, not $request: $uri is the
    # normalised path WITHOUT the query string, so signed/one-shot tokens passed
    # as query parameters never land in the log file.

    access_log C:/nginx/logs/access.log estudio;

    # A missing favicon or static file is not an error worth a line in error.log.
    log_not_found off;

    # There is no logrotate on Windows. Rotation is a Scheduled Task that
    # renames the two log files and then runs:
    #     C:\nginx\nginx.exe -p C:/nginx/ -s reopen
    # Without the reopen, nginx keeps writing to the renamed handle forever.
    # (nginx opens its logs with FILE_SHARE_DELETE, so the rename succeeds even
    # while nginx holds the file open.)

    # ---------------------------------------------------------------------
    # I/O AND TIMEOUTS
    # ---------------------------------------------------------------------
    # sendfile()/TransmitFile zero-copy is not used by the Windows build; leave
    # it off so nothing depends on behaviour this platform does not have.
    # tcp_nopush is meaningless without it, so it is omitted.
    sendfile     off;
    tcp_nodelay  on;        # send small SSE frames immediately, do not Nagle-delay them

    keepalive_timeout   65s;
    client_header_timeout 30s;

    # Per-read timeout while receiving an upload body. A 30 MB photo from a
    # phone on a weak mobile uplink can trickle; the 60s default is survivable
    # but tight, and a timeout here shows up to her as a failed upload with no
    # explanation. 120s of silence is still a dead connection.
    client_body_timeout 120s;
    send_timeout        120s;

    # Buffer the upload to a temp file rather than streaming it into uvicorn.
    # This matters specifically because there is ONE uvicorn worker: with
    # request buffering off, a slow phone upload occupies that worker for the
    # entire transfer and the whole app appears frozen. nginx absorbs the slow
    # client; uvicorn sees a fast local POST.
    client_body_buffer_size 256k;
    client_body_temp_path   C:/nginx/temp/client_body 1 2;
    proxy_temp_path         C:/nginx/temp/proxy;

    # Default cap for everything. /upload raises it; nothing else needs it, and
    # a low global ceiling means a stray POST to any other route cannot be used
    # to fill the disk.
    client_max_body_size 1m;

    # ---------------------------------------------------------------------
    # COMPRESSION
    # gzip_proxied is left at its default (off), which means nginx does NOT
    # gzip anything coming from uvicorn. That is exactly what we want: it makes
    # it impossible to accidentally compress -- and therefore buffer -- the SSE
    # stream. Only the local /static/ files get compressed.
    # ---------------------------------------------------------------------
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    # text/javascript AND application/javascript: current nginx mime.types maps
    # .js to text/javascript, so listing only the application/ form silently
    # leaves every script uncompressed.
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/manifest+json;

    # ---------------------------------------------------------------------
    # TLS PARAMETERS -- SET AT http LEVEL, ON PURPOSE.
    #
    # These belong here and NOT inside the application server block. The
    # handshake parameters for a listen socket come from that socket's
    # default_server; the catch-all `server_name _;` block at the bottom of
    # this file is the default_server for 443. If ssl_protocols/ssl_ciphers
    # live only in the named server, the catch-all runs on nginx's built-in
    # defaults -- which still include TLSv1 and TLSv1.1 -- and the hardened
    # list below silently does not apply to the handshake. Defining them once
    # here means both server blocks are identical and there is nothing to get
    # out of step. Only ssl_certificate/ssl_certificate_key stay per-server.
    # ---------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;

    # ECDHE-only suite list. Deliberately excludes DHE, which means no
    # dhparam.pem file is needed -- one less binary blob to generate on a
    # Windows box that has no openssl in PATH by default.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Off, so TLS 1.3 clients get their own preference order (which is
    # already sane and hardware-aware). Only relevant for the 1.2 suites.
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;   # no ticket key rotation story on this box;
                               # the session cache alone is enough for one user

    # OCSP stapling is intentionally NOT enabled: Let's Encrypt has retired
    # its OCSP responders, so stapling would produce nothing but periodic
    # errors in error.log. Also note nginx/Windows has no /etc/resolv.conf,
    # so any feature needing DNS would require an explicit `resolver`.

    # ---------------------------------------------------------------------
    # UPSTREAM
    # ---------------------------------------------------------------------
    upstream estudio_app {
        server 127.0.0.1:8000 fail_timeout=0;
        # fail_timeout=0: there is exactly one backend. Letting nginx mark it
        # "down" after a couple of errors would turn a single hiccup into a
        # blanket 502 for the next 10 seconds with no attempt to reconnect.

        # Reuse upstream connections. Requires HTTP/1.1 + an empty Connection
        # header on the proxy side, both set at server level below.
        keepalive 16;
    }

    # ---------------------------------------------------------------------
    # No rate limiting is configured, on purpose. The preview grid fetches six
    # /media/ images at once the moment a batch finishes; a naive limit_req
    # would throttle exactly the traffic pattern this app is built around and
    # look like a bug. Brute-force protection for the login belongs in the app,
    # where it can count failed passwords instead of counting packets.
    # ---------------------------------------------------------------------

    # =====================================================================
    # PORT 80 -- ACME challenge + redirect to HTTPS
    # =====================================================================
    server {
        listen      80;
        listen      [::]:80;
        # If this host has IPv6 disabled, nginx cannot bind [::] and EXITS --
        # taking the whole site down, not just IPv6. If `nginx -t` or the error
        # log shows a bind failure on [::], delete every [::] listen line in
        # this file rather than trying to work around it.
        server_name estudio.example.com;    # <-- set to the real hostname

        # win-acme's http-01 validation writes a token file under the webroot.
        # It must be reachable over plain http, so it is matched BEFORE the
        # redirect. ^~ stops nginx from considering any regex location.
        # If you validate with DNS-01 instead, delete this block.
        location ^~ /.well-known/acme-challenge/ {
            root      C:/nginx/html;        # win-acme webroot: C:/nginx/html
            autoindex off;
            access_log off;
            default_type text/plain;
        }

        # Everything else: permanent redirect, preserving path and query.
        # 301 rather than 302 so browsers stop trying http:// altogether --
        # which matters here because the session cookie is Secure and would be
        # dropped on any request that stayed on http.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =====================================================================
    # PORT 443 -- the application
    # =====================================================================
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;

        # nginx >= 1.25.1 syntax. On an older build this directive does not
        # exist -- use `listen 443 ssl http2;` above and delete this line.
        # HTTP/2 is worth having here for a concrete reason: over HTTP/1.1 the
        # open SSE stream permanently consumes one of the browser's six
        # connections to this origin; over HTTP/2 it is one stream among many.
        # (It is repeated in the catch-all below, because ALPN is negotiated
        # against the socket's default_server.)
        http2 on;

        server_name estudio.example.com;    # <-- set to the real hostname

        # -----------------------------------------------------------------
        # TLS -- certificate only. Protocols/ciphers/session settings are at
        # http level above; do not re-declare them here.
        #
        # win-acme, run with the "pemfiles" store plugin, writes:
        #     <friendlyname>-chain.pem       leaf + intermediates  -> ssl_certificate
        #     <friendlyname>-key.pem         private key           -> ssl_certificate_key
        #     <friendlyname>-crt.pem         leaf only (NOT this one)
        # The directory is whatever you gave win-acme for the PEM files path.
        # VERIFY the real directory and file names after the first issuance and
        # correct the two lines below; the names embed the friendly name of the
        # renewal, so they are not guessable from here.
        #
        # The key must have NO password. If win-acme was given one, nginx will
        # block at startup waiting on a console prompt that, under a service
        # wrapper, nobody will ever answer -- nginx simply never comes up.
        #
        # After each renewal nginx must be reloaded or it keeps serving the old,
        # expired certificate from memory. Configure win-acme's script
        # installation step to run:
        #     C:\nginx\nginx.exe -p C:/nginx/ -s reload
        # Check the exact win-acme argument names in its own menus rather than
        # copying them from anywhere, including here.
        #
        # BELT AND BRACES for the "site dies silently at day 90" failure: also
        # create a Scheduled Task (Run whether user is logged on or not, as
        # SYSTEM, daily) that runs that same reload command. A reload of an
        # unchanged config costs nothing, and it means a missed or mis-typed
        # win-acme hook delays the new certificate by at most 24 hours instead
        # of expiring the site.
        # -----------------------------------------------------------------
        ssl_certificate     C:/ProgramData/win-acme/pem/estudio.example.com-chain.pem;
        ssl_certificate_key C:/ProgramData/win-acme/pem/estudio.example.com-key.pem;

        # -----------------------------------------------------------------
        # SECURITY HEADERS
        #
        # READ THIS BEFORE EDITING ANY LOCATION BELOW:
        # add_header does NOT accumulate across levels. The moment a location
        # block contains its own add_header, every add_header inherited from
        # this server block disappears for that location. That is why the
        # security headers are repeated verbatim inside /static/, /sw.js,
        # /media/ and the two named error locations. If you add an add_header
        # to a location that has none today, you must copy this whole set into
        # it too.
        #
        # `always` is required so the headers are present on 4xx/5xx responses
        # as well -- an error page is still a page an attacker can frame.
        # -----------------------------------------------------------------
        add_header X-Content-Type-Options  "nosniff"                              always;
        add_header X-Frame-Options         "DENY"                                 always;
        add_header Referrer-Policy         "no-referrer"                          always;
        add_header Content-Security-Policy "frame-ancestors 'none'"               always;
        add_header X-Robots-Tag            "noindex, nofollow, noarchive, noimageindex" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # HSTS is the header that makes the Secure-cookie story airtight: once
        # it is cached, the browser will not even emit an http:// request that
        # could carry the session cookie in the clear. No `preload` token --
        # do not opt into the preload list until you are certain this hostname
        # will never need plain http again, because removal takes months.
        #
        # Referrer-Policy no-referrer matters more than usual here: /media/ URLs
        # identify her photographs, and a bare "no-referrer" guarantees they are
        # never leaked in a Referer header to anything she clicks through to.
        #
        # A full CSP (script-src/style-src/img-src) is NOT enabled because an
        # untested CSP silently breaks the UI. If you want one, add it, then
        # open the browser console and confirm the app still works before
        # walking away from the machine.

        # -----------------------------------------------------------------
        # PROXY DEFAULTS -- inherited by every location that does not define
        # a proxy_set_header of its own.
        #
        # SAME INHERITANCE TRAP AS add_header: one proxy_set_header inside a
        # location wipes out all six of these for that location. Do not add a
        # single proxy_set_header to a location below without copying this
        # entire block into it. Getting this wrong is how X-Forwarded-Proto
        # silently disappears. (No location below defines one -- keep it that
        # way.)
        # -----------------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # $host, not $proxy_host: the app builds absolute URLs and scopes the
        # session cookie from the Host header. $proxy_host would hand it
        # "127.0.0.1" and the cookie would be issued for the wrong domain.

        proxy_set_header X-Forwarded-Proto $scheme;
        # THE cookie header. uvicorn's --proxy-headers reads this to decide the
        # request scheme, and the app marks the session cookie Secure from it.
        # $scheme is "https" in this server block; the port-80 block never
        # proxies anything, it only redirects, so the app can never be handed
        # "http". If it were absent or said "http", one of two things happens,
        # both bad: either the cookie is issued without Secure (and can leak
        # over a downgraded request), or the app issues it Secure while
        # believing the connection is plain http and the browser refuses to
        # store it -- she logs in, is bounced straight back to the login form,
        # forever.
        # Note this is a hard SET, not a pass-through: a client-supplied
        # X-Forwarded-Proto is overwritten, so nobody can talk nginx into
        # claiming a request was https when it was not.

        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_set_header X-Forwarded-For   $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for. nginx is the only proxy
        # in front of this app, so there is no legitimate inbound XFF to
        # preserve -- appending would just let a client prepend a forged
        # address that ends up in the app's logs and any IP-based logic.

        proxy_set_header Connection        "";
        # Clears the hop-by-hop Connection header so the upstream keepalive
        # pool works. Also keeps a client-sent "Connection: close" from tearing
        # down the pooled connection.

        proxy_connect_timeout 5s;   # uvicorn is on loopback; if it does not
                                    # accept in 5s it is down, fail fast
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;  # global default; /events/ overrides it
        proxy_redirect off;         # Host is preserved, so upstream Location
                                    # headers are already correct as written

        # No proxy_cache zone is defined anywhere in this file. That is
        # deliberate: nothing behind the auth cookie -- least of all /media/ --
        # may ever be written to a shared on-disk cache.

        # proxy_ignore_client_abort is left at its default (off) so that when
        # she closes the tab, nginx closes the upstream connection and the
        # FastAPI SSE generator sees the disconnect and stops. Turning it on
        # leaks a live generator per abandoned stream.

        # =================================================================
        # 1. SERVER-SENT EVENTS  --  GET /events/{session_id}
        #
        # WHAT SHE SEES IF THIS IS WRONG:
        # The preview grid sits completely still. No spinner movement, no
        # images, nothing -- for the entire 60-180 seconds of the batch. Then
        # all six previews pop in at once, in the same instant, right at the
        # end. The app looks broken and hung, and the whole point of streaming
        # previews as they complete is lost. That is nginx holding the event
        # frames in its proxy buffers and flushing them only when the response
        # finally closes. The second failure mode is worse: with a 60s read
        # timeout, a batch that goes quiet for longer than that gets the stream
        # killed mid-run with a 504, and the grid freezes and never recovers.
        # =================================================================
        location ^~ /events/ {
            proxy_pass http://estudio_app;

            # The core fix. With buffering on, nginx accumulates the response
            # in proxy_buffers and only forwards when a buffer fills or the
            # response ends -- which for an SSE stream means "at the end".
            proxy_buffering off;

            # Belt and braces. No cache zone exists, but state this explicitly
            # so that adding one later cannot accidentally swallow the stream.
            proxy_cache off;

            # Default is on; stated explicitly because it is load-bearing here.
            # The SSE response has no Content-Length -- its length is unknown
            # until it ends -- so HTTP/1.1 clients need chunked framing to
            # receive anything before the connection closes. (HTTP/2 clients
            # use HTTP/2's own framing and ignore this; it is here for the
            # HTTP/1.1 path and for anything that negotiates down.)
            chunked_transfer_encoding on;

            # The write filter will normally hold back an output chain smaller
            # than postpone_output (1460 bytes by default). Non-buffered
            # proxying flags each chunk for flush so this does not bite today,
            # but a single SSE frame is far smaller than 1460 bytes and there
            # is no reason to depend on that detail. 0 = never postpone.
            postpone_output 0;

            # Never compress an event stream: the compressor is itself a
            # buffer and reintroduces exactly the stall described above.
            # Redundant given gzip_proxied is off, kept as a guardrail.
            gzip off;

            # These are per-READ timeouts, not total-request timeouts: the
            # clock resets on every byte from uvicorn. A well-behaved SSE
            # endpoint sends a ": keepalive" comment every 15s and would
            # survive the 60s default -- but the whole point of this route is
            # that it can go quiet while six images render, and betting the
            # feature on the app's heartbeat never slipping is how the 504
            # happens. One hour is far past any plausible batch.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Timeout on writes toward the browser. Long enough that a phone
            # on a bad connection is not dropped mid-batch, short enough that
            # a genuinely dead client is eventually reaped.
            send_timeout 300s;

            # X-Accel-Buffering: this is a RESPONSE header, sent by the app,
            # that nginx consumes and strips -- it cannot be set from here with
            # proxy_set_header (that would send it upstream as a request header
            # and do nothing at all). The app should emit it on this route:
            #     return StreamingResponse(gen(), media_type="text/event-stream",
            #         headers={"Cache-Control": "no-cache",
            #                  "X-Accel-Buffering": "no"})
            # It is the app-side safety net that keeps streaming working even
            # if this location block is ever lost or mismatched. Do not remove
            # proxy_buffering off on the strength of it -- keep both.
            # nginx honours it by default; proxy_ignore_headers must NOT list
            # X-Accel-Buffering anywhere in this file, and it does not.

            access_log off;   # one line per stream, hundreds of seconds of
                              # $request_time -- noise, not signal
        }

        # =================================================================
        # 3. UPLOAD  --  POST /upload, up to 30 MB
        # =================================================================
        location = /upload {
            proxy_pass http://estudio_app;

            # 32m, not 30m: the app enforces the real 30 MB limit on the file
            # itself. nginx measures the whole multipart body, which is the
            # file plus MIME boundaries, field names and base64-ish overhead.
            # Setting nginx to exactly 30m makes nginx reject files the app
            # would have accepted, and nginx's rejection is the ugly one.
            client_max_body_size 32m;

            # HEIC needs no special handling here -- nginx does not inspect or
            # transcode the request body, it just relays bytes. Any HEIC
            # conversion is the app's problem.

            # A 30 MB upload plus server-side handoff can outrun the defaults.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # proxy_request_buffering stays on (inherited default) -- see the
            # client_body_buffer_size note above: it protects the single
            # uvicorn worker from slow phone uplinks.
        }

        # Readable 413 instead of nginx's stock HTML page, which in a
        # fetch()/XHR upload flow surfaces to her as nothing at all.
        error_page 413 = @too_large;
        location @too_large {
            default_type application/json;
            # This location defines add_header, so it must restate the security
            # headers (see the inheritance warning above).
            add_header X-Content-Type-Options  "nosniff"                              always;
            add_header X-Frame-Options         "DENY"                                 always;
            add_header Referrer-Policy         "no-referrer"                          always;
            add_header Content-Security-Policy "frame-ancestors 'none'"               always;
            add_header X-Robots-Tag            "noindex, nofollow, noarchive, noimageindex" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            return 413 '{"error":"file_too_large","message":"That photo is larger than 30 MB. Try again with a smaller image.","limit_mb":30}';
        }
        # Caveat worth knowing: nginx rejects on Content-Length before reading
        # the body, then stops reading. Some browsers surface that as a
        # connection reset rather than showing this JSON. lingering_close is
        # left at its default (on), which gives the response the best chance of
        # arriving -- but the reliable fix is a client-side size check in the
        # upload form before the request is ever sent.
        # (recursive_error_pages is off by default, so the 413 returned from
        # inside this handler is not re-caught -- there is no loop here.)

        # =================================================================
        # 7. MEDIA  --  proxied to the app, never served from disk
        # =================================================================
        location ^~ /media/ {
            # These files live under C:\estudio\data. There is deliberately no
            # root/alias here and no static handler anywhere that can reach
            # that directory. They are private photographs of an identifiable
            # person, protected by a session cookie that ONLY the app can
            # check -- nginx has no idea whether the cookie is valid. A `root`
            # pointed at C:/estudio/data would serve every image in the app to
            # anyone who guesses or is shown a URL, with no auth at all.
            proxy_pass http://estudio_app;

            # Buffering stays on here (unlike /events/): these are ordinary
            # finite image responses and buffering frees the uvicorn worker as
            # soon as the file is handed to nginx. A response larger than the
            # in-memory proxy buffers is spooled to C:/nginx/temp/proxy and
            # deleted when the request ends; that directory therefore holds
            # short-lived plaintext copies of her images and must not be
            # excluded from disk encryption or included in any backup.

            # This location defines add_header, so it restates the full set
            # plus one of its own.
            add_header X-Content-Type-Options  "nosniff"                    always;
            add_header X-Frame-Options         "DENY"                       always;
            add_header Referrer-Policy         "no-referrer"                always;
            add_header Content-Security-Policy "frame-ancestors 'none'"     always;
            add_header X-Robots-Tag            "noindex, nofollow, noarchive, noimageindex" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cross-Origin-Resource-Policy "same-origin"           always;
            # CORP same-origin: stops any other website from hot-linking or
            # <img>-embedding one of her photographs, even if a URL escapes.

            # Cache-Control is NOT set here. The URLs are immutable, so the app
            # is free to send `private, max-age=31536000, immutable` itself --
            # and it must be the one to say `private`, because it is the only
            # component that knows these bytes belong to one authenticated
            # session. Overriding from nginx risks marking an auth-gated image
            # publicly cacheable.

            access_log off;   # see the LOGGING note: no bulk image URL index
        }

        # =================================================================
        # 6a. STATIC  --  public assets, served by nginx
        # =================================================================
        location ^~ /static/ {
            # VERIFY: /static/x must resolve to the same file the app serves
            # from its StaticFiles mount. `root` (not `alias`) is used
            # deliberately: /static/app.css -> C:/estudio/app/static/app.css,
            # exactly the same mapping, without putting try_files inside an
            # alias location -- a pairing nginx has historically mishandled.
            # If the app's static directory is somewhere else, fix this line;
            # if you cannot confirm it, delete this whole block and let the
            # app serve /static/ through `location /` (correctness first).
            root C:/estudio/app;

            # Never, under any circumstances, list a directory. Off is the
            # default; it is stated because the cost of it being on once is a
            # browsable index of the app's internals.
            autoindex off;

            # Do not fall through to the proxy on a miss -- a typo'd asset
            # should be a clean 404, not a request the app has to answer.
            try_files $uri =404;

            # CONSERVATIVE ON PURPOSE. One hour is safe for any filename.
            # Raise this to
            #     expires 1y;   (which emits max-age=31536000)
            # ONLY if the static filenames are content-hashed (app.9f3c1a.css).
            # With stable names like style.css, a long max-age -- and above all
            # the `immutable` token -- pins the stylesheet in her browser AND
            # in the service worker's cache. Deploys then appear to do nothing
            # and no reload will dislodge them; the only cure is unregistering
            # the worker in devtools on her machine. A stale asset for an hour
            # is survivable. A permanently pinned one is not.
            expires 1h;

            # add_header used below => restate the inherited set.
            add_header X-Content-Type-Options  "nosniff"                always;
            add_header X-Frame-Options         "DENY"                   always;
            add_header Referrer-Policy         "no-referrer"            always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            # No Cache-Control here: `expires` above already emits one, and two
            # Cache-Control headers on one response is exactly the ambiguity
            # the /sw.js block below goes out of its way to avoid.

            access_log off;
        }

        # =================================================================
        # 6b. SERVICE WORKER  --  GET /sw.js, never cached
        # =================================================================
        location = /sw.js {
            # Proxied rather than served from disk because /sw.js is listed as
            # an application route. If it is in fact a plain file in the static
            # directory, replace the proxy_pass with:
            #     alias C:/estudio/app/static/sw.js;
            # and keep every header line below exactly as-is.
            proxy_pass http://estudio_app;

            # Strip whatever Cache-Control the app sent before adding ours,
            # otherwise the response carries two contradictory Cache-Control
            # headers and the browser picks whichever it likes.
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;

            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Expires       "0"     always;
            add_header Pragma        "no-cache" always;
            # A cached service worker is the worst kind of stale: it installs
            # itself, then serves its own cached copies of the app shell to
            # her browser on every subsequent visit. She pins an old version of
            # the app permanently, deploys appear to do nothing, and the only
            # cure is manually unregistering the worker in devtools. Browsers
            # additionally cap sw.js freshness at 24h, but that cap is a
            # backstop, not a substitute for saying no-store here.

            # The service worker script must be served with a JavaScript MIME
            # type or the browser refuses to register it. Coming from the app,
            # FastAPI sets it; if you switch to the `alias` form above, confirm
            # mime.types maps .js to a JavaScript type (it does in the stock
            # file -- current versions map it to text/javascript).

            # add_header used => restate the inherited set.
            add_header X-Content-Type-Options  "nosniff"                always;
            add_header X-Frame-Options         "DENY"                   always;
            add_header Referrer-Policy         "no-referrer"            always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # =================================================================
        # HEALTH  --  GET /health
        # =================================================================
        location = /health {
            proxy_pass http://estudio_app;

            # An uptime monitor polling every 30-60s would otherwise be the
            # single largest contributor to access.log, drowning real traffic.
            access_log off;

            # Fail fast: a health check that hangs for 60s is useless to a
            # monitor whose own timeout is shorter than that.
            proxy_read_timeout 10s;
            proxy_connect_timeout 3s;
        }

        location = /robots.txt {
            # Belt and braces with the X-Robots-Tag header above. This host
            # should never appear in a search index.
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # =================================================================
        # EVERYTHING ELSE  --  the UI, POST /previews, POST /finals, auth
        # =================================================================
        location / {
            proxy_pass http://estudio_app;
            # /previews and /finals return immediately and continue in a
            # background task, so the inherited 60s proxy_read_timeout is
            # ample. If either ever starts doing work inline before responding,
            # give it its own location with a longer timeout rather than
            # raising the global one.
        }

        # Readable upstream failures. Most likely cause by far: the uvicorn
        # service did not come up after a reboot, or crashed on a bad .env.
        error_page 502 503 504 = @app_down;
        location @app_down {
            default_type application/json;
            add_header X-Content-Type-Options  "nosniff"                              always;
            add_header X-Frame-Options         "DENY"                                 always;
            add_header Referrer-Policy         "no-referrer"                          always;
            add_header Content-Security-Policy "frame-ancestors 'none'"               always;
            add_header X-Robots-Tag            "noindex, nofollow, noarchive, noimageindex" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Retry-After             "15"                                   always;
            return 503 '{"error":"app_unavailable","message":"The application is not responding. Check that the uvicorn service is running."}';
        }
    }

    # =====================================================================
    # CATCH-ALL  --  anything that is not the real hostname
    # Scanners hit this box by raw IP all day. Without a default server they
    # would be handed the app's login page (and its existence). 444 is nginx's
    # non-standard "close the connection without a response", which tells them
    # nothing at all. The 443 listener still needs a certificate to get far
    # enough into the handshake to reject the request, so it reuses the same
    # files -- clients will see a name mismatch, which is the correct outcome.
    #
    # This block is the default_server for both sockets, which is why the TLS
    # parameters and http2 are set where BOTH servers get them: whatever this
    # block would fall back to is what governs the handshake on port 443.
    # =====================================================================
    server {
        listen      80  default_server;
        listen      [::]:80 default_server;
        listen      443 ssl default_server;
        listen      [::]:443 ssl default_server;
        http2 on;                       # delete on nginx < 1.25.1
        server_name _;

        ssl_certificate     C:/ProgramData/win-acme/pem/estudio.example.com-chain.pem;
        ssl_certificate_key C:/ProgramData/win-acme/pem/estudio.example.com-key.pem;

        access_log off;
        return 444;
    }
}