{% extends "base.html" %}
{% block title %}Listas{% endblock %}

{% block content %}
<h1 id="headline">Terminando…</h1>
<!-- The cost line comes from the same ledger the money did, so the number she
     sees and the number she was charged cannot drift apart. -->
<p class="muted" id="summary"></p>

<div class="grid" id="grid">
  {% for final in finals %}
    <div class="cell" data-url="{{ final.url }}">
      <img src="{{ final.url }}" alt="" loading="lazy">
    </div>
  {% endfor %}
</div>

<div id="notices"></div>

<div class="bar">
  <div class="bar-inner">
    <button class="go" onclick="location.href='/'">Otra foto</button>
    <button class="go secondary" onclick="location.href='/galeria'">Ver la galería</button>
  </div>
</div>

<div class="viewer" id="viewer">
  <img id="viewer-img" alt="">
  <div class="viewer-actions">
    <a id="download" download>Descargar</a>
    <button onclick="document.getElementById('viewer').classList.remove('open')">Cerrar</button>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
const SESSION = "{{ session_id }}";
const grid = document.getElementById('grid');
let done = {{ finals | length }};

const stream = new EventSource(`/events/${SESSION}`);

stream.addEventListener('final_repairing', (event) => {
  // Repairs happen silently as far as her workflow is concerned - she is
  // never asked to approve one - but showing that something is being fixed
  // beats an unexplained pause.
  const data = JSON.parse(event.data);
  document.getElementById('headline').textContent = `Corrigiendo ${data.what}…`;
});

stream.addEventListener('final_ready', (event) => {
  const data = JSON.parse(event.data);
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.dataset.url = data.url;
  cell.innerHTML = `<img src="${data.url}" alt="" loading="lazy">`;
  cell.addEventListener('click', () => open(data.url));
  grid.appendChild(cell);
  done++;
});

stream.addEventListener('finals_done', (event) => {
  const data = JSON.parse(event.data);
  document.getElementById('headline').textContent =
    `Listas · ${data.delivered} foto${data.delivered === 1 ? '' : 's'}`;
  document.getElementById('summary').textContent =
    `${data.elapsed}s · $${(data.cost ?? 0).toFixed(3)}`;

  // The one place a failure is ever surfaced: when it could not be recovered
  // silently, she is told plainly rather than quietly given fewer photos.
  if (data.failed) {
    // APPEND, never replace. An error event carrying the actual reason
    // arrives first, and overwriting it here left her - and whoever maintains
    // this - with "no salieron bien" and nothing whatever to act on.
    document.getElementById('notices').insertAdjacentHTML('beforeend',
      `<div class="notice bad">${data.failed} no salieron bien y las he descartado.
       No te las cobro como buenas.</div>`);
  }
  stream.close();
});

stream.addEventListener('error', (event) => {
  try {
    const data = JSON.parse(event.data || '{}');
    if (data.detail) {
      document.getElementById('notices').insertAdjacentHTML('beforeend',
        `<div class="notice bad">${data.detail}</div>`);
    }
  } catch (_) {}
});

function open(url) {
  document.getElementById('viewer-img').src = url;
  document.getElementById('download').href = url;
  document.getElementById('viewer').classList.add('open');
}

grid.querySelectorAll('.cell').forEach(cell => {
  cell.addEventListener('click', () => open(cell.dataset.url));
});
</script>
{% endblock %}
